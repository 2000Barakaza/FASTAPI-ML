name: FASTAPI-ML Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9"]  # Bumped to 3.9 for Altair 6.0.0 compatibility; add "3.10", "3.11", "3.12" later for broader testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v5  # Latest stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'  # Caches pip installs → much faster on repeat runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python ./main_test.py   # Change to ./test_predict.py if that's your actual test file


        
