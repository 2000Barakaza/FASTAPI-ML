name: FASTAPI-ML Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]  # Bumped to 3.12 for compatibility with modern deps like charset-normalizer 3.4.4

    env:
      MODE: ${{ secrets.MODE }}  # Fixed: added space after colon
 ##  secrete.MOE


    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python ./main.py  # Updated back to main_test.py (adjust if main.py is correct for your tests)

        












